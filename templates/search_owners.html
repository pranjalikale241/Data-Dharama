<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Data Dharma | Search Data Owners</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<div class="container py-5">

    <div class="mb-4">

        <h1 class="fw-bold">
            🔎 Search Data Owners
        </h1>

        <p class="text-muted">
            Search for a Data Owner using their username.
        </p>

    </div>


    <!-- SEARCH FORM -->

    <div class="card shadow-sm rounded-4 mb-4">

        <div class="card-body p-4">

            <form method="POST">

                <label class="form-label fw-bold">
                    Data Owner Username
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        @
                    </span>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="e.g. pranjalikale@12"
                        required
                    >

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Search
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- SEARCH RESULTS -->

    {% if owners %}

        <h3 class="fw-bold mb-3">
            Search Results
        </h3>

        {% for owner in owners %}

        <div class="card shadow-sm rounded-4 mb-3">

            <div class="card-body d-flex
                        justify-content-between
                        align-items-center">

                <div>

                    <h4 class="fw-bold mb-1">
                        👤 @{{ owner[1] }}
                    </h4>

                    <p class="text-muted mb-0">
                        Data Owner
                    </p>

                </div>

                <a
                    href="/profile/{{ owner[1] | urlencode }}"
                    class="btn btn-primary"
                >
                    View Profile →
                </a>

            </div>

        </div>

        {% endfor %}

    {% elif request.method == "POST" %}

        <div class="alert alert-warning rounded-4">

            No Data Owner found with that username.

        </div>

    {% endif %}


    <a
        href="/"
        class="btn btn-outline-secondary mt-3"
    >
        🏠 Back to Dashboard
    </a>

</div>

</body>
</html>
