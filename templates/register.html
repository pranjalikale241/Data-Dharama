<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Data Dharma | Register</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-card {
            width: 100%;
            max-width: 480px;
            border: none;
            border-radius: 20px;
        }

        .brand {
            font-weight: 700;
            font-size: 30px;
        }

        .subtitle {
            color: #6c757d;
        }

        .role-card {
            border: 1px solid #dee2e6;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .role-card:hover {
            border-color: #0d6efd;
            background: #f8fbff;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card register-card shadow-lg mx-auto">

        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">

                <div class="brand">
                    Data Dharma
                </div>

                <p class="subtitle mb-0">
                    Create your secure account
                </p>

            </div>


            {% if error %}

            <div class="alert alert-danger">
                {{ error }}
            </div>

            {% endif %}


            <form method="POST">

                <!-- Username -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        class="form-control form-control-lg"
                        placeholder="e.g. pranjali_kale"
                        required
                    >

                    <small class="text-muted">
                        This will be your Data Dharma username.
                    </small>

                </div>


                <!-- Password -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control form-control-lg"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- Confirm Password -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        name="confirm_password"
                        class="form-control form-control-lg"
                        placeholder="Enter password again"
                        required
                    >

                </div>


                <!-- Account Type -->

                <div class="mb-4">

                    <label class="form-label fw-semibold">
                        Account Type
                    </label>

                    <select
                        name="role"
                        class="form-select form-select-lg"
                        required
                    >

                        <option value="">
                            Select account type
                        </option>

                        <option value="owner">
                            Data Owner
                        </option>

                        <option value="organization">
                            Organization
                        </option>

                    </select>

                </div>


                <!-- Register Button -->

                <button
                    type="submit"
                    class="btn btn-primary btn-lg w-100"
                >
                    Create Account
                </button>

            </form>


            <div class="text-center mt-4">

                <span class="text-muted">
                    Already have an account?
                </span>

                <a
                    href="/login"
                    class="text-decoration-none fw-semibold"
                >
                    Login
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
